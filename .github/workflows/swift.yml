name: AurumBar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aurumbar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Build release candidate
        run: scripts/build-release.sh 0.1.3 --signing unsigned

      - name: Validate scripts and Formula
        run: |
          bash -n scripts/*.sh
          ruby -c Formula/aurumbar.rb

  formula:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create temporary tap
        run: |
          TAP="$(brew --repository)/Library/Taps/aurumbar/homebrew-ci"
          mkdir -p "$TAP/Formula"
          cp Formula/aurumbar.rb "$TAP/Formula/"

      - name: Fetch, install, and test Formula
        run: |
          brew fetch --force aurumbar/ci/aurumbar
          brew install --build-from-source aurumbar/ci/aurumbar
          brew test aurumbar/ci/aurumbar
          "$(brew --prefix aurumbar/ci/aurumbar)/bin/aurumbar" --version
